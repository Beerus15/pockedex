<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Suprema Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/pokedex.css">
</head>
<body>
    <div class="pokedex-wrapper">
        <section class="content flex-panel-left">
            <header class="pokedex-device-header">
                <div class="main-lens"></div>
                <div class="status-leds">
                    <span class="led-bulb red"></span>
                    <span class="led-bulb yellow"></span>
                    <span class="led-bulb green"></span>
                </div>
            </header>

            <div class="search-bar-container">
                <input type="text" id="inputSearch" placeholder="Buscar por nome ou número...">
                <button id="btnSearch">Buscar</button>
            </div>

            <ol id="pokemonList" class="pokemons">
                </ol>

            <div class="pagination">
                <button id="LoadMoreButton" type="button">Carregar Mais</button>
            </div>
        </section>

        <div class="pokedex-hinge-device"></div>

        <aside class="content flex-panel-right" id="pokedexDetailsPanel">
            <div class="empty-state-msg">
                <p>Selecione um Pokémon na lista para ligar o scanner de dados biométricos.</p>
            </div>
        </aside>
    </div>

    <script src="assets/js/pokemon-model.js"></script>
    <script src="assets/js/poke-api.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
